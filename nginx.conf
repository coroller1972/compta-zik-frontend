index index.html;

location = /index.html {
    add_header Cache-Control "no-store";
    try_files $uri =404;
}

# nginx 1.24 ne connaît pas toujours l'extension ES module .mjs dans sa
# table MIME embarquée. Sans ce type explicite, Chromium refuse le module.
location ~* \.mjs$ {
    default_type application/javascript;
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
}

location /src/ {
    add_header Cache-Control "public, max-age=300";
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
}
